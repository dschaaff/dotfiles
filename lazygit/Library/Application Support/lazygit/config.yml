# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
gui:
  showIcons: true
  nerdFontsVersion: "3"
git:
  commit:
    signOff: true
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
customCommands:
  - key: "G"
    description: "AI commit message"
    context: "files"
    loadingText: "Generating commit message..."
    command: |
      DIFF=$(git diff --cached --diff-algorithm=minimal)
      if [ -z "$DIFF" ]; then
        DIFF=$(git diff --diff-algorithm=minimal)
      fi
      if [ -z "$DIFF" ]; then
        echo "No changes to commit"
        exit 1
      fi
      MSG=$(echo "$DIFF" | \
        AWS_REGION=us-west-2 AWS_PROFILE=Cordial-Development/Developer \
        CLAUDE_CODE_USE_BEDROCK=1 CLAUDE_CODE_EFFORT_LEVEL=medium \
        AWS_REGION=us-west-2 AWS_PROFILE=Cordial-Development/Developer \
        claude -p --model us.anthropic.claude-sonnet-4-6 "You are a commit message generator. Analyze the provided git diff and output ONLY the commit message, nothing else. Rules: Use imperative mood. Start with capital letter. No period at end. Max 50 chars. Be specific. Describe WHAT changed and why. Include a title as well as a descriptive body." 2>/dev/null)
      if [ -n "$MSG" ]; then
        git commit -e -m "$MSG"
      fi
    output: terminal
